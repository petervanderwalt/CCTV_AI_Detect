name: Build Windows installer

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller

      - name: Build application package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force models | Out-Null
          .\.venv\Scripts\python.exe -m PyInstaller --noconfirm --clean CCTV-Human-Detector.spec

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=1.0.$env:GITHUB_RUN_NUMBER" installer\CCTV-Human-Detector.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CCTV-Human-Detector-Setup
          path: release\CCTV-Human-Detector-Setup.exe
          if-no-files-found: error
